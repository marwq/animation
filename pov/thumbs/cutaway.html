<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thumbnail scene: cutaway Earth</title>
<!-- Обложка C: Земля в разрезе (вырезана четверть, как у апельсина). Нью-Йорк — точно наверху, путь идёт по
     ребру выреза сквозь центр, внизу — точка выхода. Низкополигональный стиль, как в самом ролике. -->
<style>html, body { margin: 0; background: transparent; } canvas { display: block; }</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { LAND } from '/pov/hud.js';

const QS = new URLSearchParams(location.search);
const W = parseInt(QS.get('w') || '900', 10);
const H = parseInt(QS.get('h') || '900', 10);
const SPIN = parseFloat(QS.get('spin') || '0');
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setPixelRatio(2);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(parseFloat(QS.get('fov') || '30'), W / H, 0.1, 50);
camera.position.set(parseFloat(QS.get('cx') || '2.4'), parseFloat(QS.get('cy') || '1.7'), parseFloat(QS.get('cz') || '3.7'));
camera.lookAt(0, -0.05, 0);

// --- суша: точка внутри многоугольника (долгота, широта) -------------------------------------------------
function inPoly(lon, lat, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i];
    const [xj, yj] = poly[j];
    if ((yi > lat) !== (yj > lat) && lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
const isLand = (lon, lat) => LAND.some((p) => inPoly(lon, lat, p));

// Земля повёрнута так, что Нью-Йорк смотрит вверх (+Y); SPIN — поворот вокруг этой оси
const dirOf = (lon, lat) => {
  const la = (lat * Math.PI) / 180;
  const lo = (lon * Math.PI) / 180;
  return new THREE.Vector3(Math.cos(la) * Math.cos(lo), Math.sin(la), -Math.cos(la) * Math.sin(lo));
};
const NYC = dirOf(-73.98, 40.76);
const toView = new THREE.Quaternion().setFromUnitVectors(NYC, new THREE.Vector3(0, 1, 0));
toView.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), (SPIN * Math.PI) / 180));
const toEarth = toView.clone().invert();

// --- оболочка: вырезана четверть, обращённая к камере (phi 45°…135°) ---------------------------------------
const GAP0 = Math.PI / 4;
{
  const g = new THREE.SphereGeometry(1, 120, 80, GAP0 + Math.PI / 2, Math.PI * 1.5).toNonIndexed();
  const p = g.attributes.position;
  const col = new Float32Array(p.count * 3);
  const c = new THREE.Color();
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i += 3) {
    v.set(0, 0, 0);
    for (let k = 0; k < 3; k++) v.add(new THREE.Vector3(p.getX(i + k), p.getY(i + k), p.getZ(i + k)));
    v.normalize().applyQuaternion(toEarth);
    const lat = (Math.asin(v.y) * 180) / Math.PI;
    const lon = (Math.atan2(-v.z, v.x) * 180) / Math.PI;
    const land = isLand(lon, lat);
    const ice = Math.abs(lat) > 72;
    const h = (Math.sin(i * 0.13) + 1) * 0.5; // лёгкий разброс оттенка граней
    if (ice) c.setRGB(0.86 + 0.06 * h, 0.9 + 0.05 * h, 0.95);
    else if (land) c.setHSL(0.27 - 0.07 * (Math.abs(lat) < 30 ? 1 - Math.abs(lat) / 30 : 0) * h, 0.42, 0.34 + 0.08 * h);
    else c.setHSL(0.58, 0.62, 0.3 + 0.05 * h);
    for (let k = 0; k < 3; k++) col.set([c.r, c.g, c.b], (i + k) * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const shell = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.75, metalness: 0 }));
  scene.add(shell);
}

// --- срезы: две полуокружности с кольцами слоёв (светятся сами, к центру — белое каление) -------------------
// радиусы слоёв (доля радиуса Земли); кора утолщена, иначе её не видно
const RINGS = [
  [1.0, '#5b4a3e', '#6b5646'], // кора
  [0.955, '#8a2414', '#b33a18'], // верхняя мантия
  [0.86, '#b8411a', '#d9601f'], // нижняя мантия
  [0.546, '#ef8a1f', '#ffb341'], // внешнее ядро (жидкое)
  [0.192, '#fff1c4', '#ffffff'], // внутреннее ядро
];
function sliceTexture() {
  const S = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  const m = S / 2;
  const N = 44; // многоугольник вместо круга — низкополигонально, как в ролике
  const poly = (r) => {
    ctx.beginPath();
    for (let k = 0; k <= N; k++) {
      const a = (k / N) * Math.PI * 2;
      ctx[k ? 'lineTo' : 'moveTo'](m + Math.cos(a) * r * m, m + Math.sin(a) * r * m);
    }
    ctx.closePath();
  };
  RINGS.forEach(([r, a, b], i) => {
    const next = RINGS[i + 1] ? RINGS[i + 1][0] : 0;
    const g = ctx.createRadialGradient(m, m, next * m, m, m, r * m);
    g.addColorStop(0, b);
    g.addColorStop(1, a);
    ctx.fillStyle = g;
    poly(r);
    ctx.fill();
    // граница слоя: тёмная линия
    ctx.strokeStyle = 'rgba(40,10,4,0.55)';
    ctx.lineWidth = 4;
    poly(r);
    ctx.stroke();
  });
  // зерно: мелкие пятна, чтобы срез не был пластиковым
  let seed = 3;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 2600; i++) {
    const a = rnd() * Math.PI * 2;
    const rr = Math.sqrt(rnd()) * 0.98;
    if (rr < 0.2) continue;
    ctx.fillStyle = rnd() < 0.5 ? 'rgba(255,220,160,0.12)' : 'rgba(60,10,0,0.12)';
    ctx.beginPath();
    ctx.arc(m + Math.cos(a) * rr * m, m + Math.sin(a) * rr * m, 2 + rnd() * 5, 0, Math.PI * 2);
    ctx.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
{
  const tex = sliceTexture();
  // два среза под разными углами к свету: один чуть темнее, чтобы вырез читался объёмным
  for (const [rotY, shade] of [[-(GAP0), 1.0], [-(GAP0 + Math.PI / 2), 0.74]]) {
    const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, toneMapped: false, color: new THREE.Color(shade, shade, shade) });
    // половина круга: локальная +X — горизонтальное направление среза, Y — ось
    const g = new THREE.CircleGeometry(1, 64, -Math.PI / 2, Math.PI);
    const uv = g.attributes.uv;
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) * 0.5 + 0.5, p.getY(i) * 0.5 + 0.5);
    const half = new THREE.Mesh(g, mat);
    half.rotation.y = rotY;
    scene.add(half);
  }
}

// --- путь: из Нью-Йорка сквозь центр к точке выхода -------------------------------------------------
const PATH_Z = 0.012;
{
  const pts = [];
  for (let k = 0; k <= 120; k++) pts.push(new THREE.Vector3(0, 1.02 - (2.04 * k) / 120, PATH_Z));
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(g, new THREE.LineDashedMaterial({ color: 0x5ff2e8, dashSize: 0.045, gapSize: 0.03, linewidth: 1, toneMapped: false }));
  line.computeLineDistances();
  scene.add(line);
  // толстая линия из тонкого цилиндра: читается на маленькой обложке
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.009, 0.009, 2.04, 8), new THREE.MeshBasicMaterial({ color: 0x9ffcf6, toneMapped: false }));
  tube.position.set(0, 0, PATH_Z);
  scene.add(tube);
  // отметки: Нью-Йорк и точка выхода
  for (const [y, color] of [[1.0, 0x5ff2e8], [-1.0, 0xffffff]]) {
    const pin = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 12), new THREE.MeshBasicMaterial({ color, toneMapped: false }));
    pin.position.set(0, y, PATH_Z);
    scene.add(pin);
  }
}
// --- герой: маленькая фигурка в зелёной куртке, летит вниз по пути ---------------------------------------
{
  const g = new THREE.Group();
  const skin = new THREE.MeshStandardMaterial({ color: 0xd7a07a, flatShading: true });
  const jacket = new THREE.MeshStandardMaterial({ color: 0x2f9e5b, flatShading: true });
  const pants = new THREE.MeshStandardMaterial({ color: 0x2a4f8a, flatShading: true });
  const box = (w, h, d, m, x, y, z, rz = 0) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); b.rotation.z = rz; g.add(b); };
  box(0.05, 0.07, 0.03, jacket, 0, 0, 0);
  box(0.032, 0.032, 0.032, skin, 0, 0.055, 0);
  box(0.016, 0.06, 0.016, jacket, -0.04, 0.035, 0, 0.6);
  box(0.016, 0.06, 0.016, jacket, 0.04, 0.035, 0, -0.6);
  box(0.02, 0.07, 0.02, pants, -0.014, -0.065, 0, 0.12);
  box(0.02, 0.07, 0.02, pants, 0.014, -0.065, 0, -0.12);
  const s = parseFloat(QS.get('hero') || '1.3');
  g.scale.setScalar(s);
  g.position.set(0, parseFloat(QS.get('heroy') || '0.42'), PATH_Z + 0.06);
  g.rotation.set(0.2, 0.5, 0);
  scene.add(g);
}

// --- свет и атмосфера ---------------------------------------------------------------------------------
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x10121c, 0.85));
const key = new THREE.DirectionalLight(0xfff2e0, 2.2);
key.position.set(-3, 3, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0x6fb8ff, 1.2);
rim.position.set(3, 1, -3);
scene.add(rim);
// ореол атмосферы: обратная сторона чуть большей сферы, к краю ярче
{
  const mat = new THREE.ShaderMaterial({
    uniforms: {},
    vertexShader: 'varying vec3 vN; varying vec3 vV; void main() { vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
    fragmentShader: 'varying vec3 vN; varying vec3 vV; void main() { float f = pow(1.0 - abs(dot(vN, vV)), 3.0); gl_FragColor = vec4(vec3(0.35, 0.65, 1.0) * f * 1.4, f); }',
    side: THREE.BackSide,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.06, 64, 48), mat));
}

window.render = () => renderer.render(scene, camera);
window.render();
window.ready = true;
</script>
</body>
</html>
