<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Channel avatar</title>
<!-- Аватар канала «First Person Physics», 800×800 (YouTube показывает кругом): своя рука тянется к планете в
     видоискателе. Цвета и бирюзовый акцент — как у обложек и надписей в роликах. -->
<style>
:root { --accent: #5ff2e8; }
html, body { margin: 0; background: #000; }
.av { position: relative; width: 800px; height: 800px; overflow: hidden; background: radial-gradient(circle at 48% 42%, #1a2f60 0%, #0b1736 48%, #050916 100%); }
.av > * { position: absolute; }
canvas { inset: 0; }
.glow { left: 0; top: 0; width: 800px; height: 800px; background: radial-gradient(circle at 372px 330px, rgba(255,150,50,.5) 0, rgba(255,120,40,.18) 210px, rgba(255,100,30,0) 330px); }
.planet { left: 222px; top: 180px; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle at 36% 32%, #fff6dc 0, #ffd36a 16%, #ff9a2e 42%, #d2521a 70%, #6a1c08 100%); box-shadow: 0 0 60px rgba(255,140,40,.55), inset -26px -30px 60px rgba(60,10,0,.55); }
.ring { left: 92px; top: 262px; width: 560px; height: 136px; border-radius: 50%; border: 12px solid var(--accent); box-sizing: border-box; transform: rotate(-18deg); box-shadow: 0 0 24px rgba(95,242,232,.55); }
.ring.back { clip-path: inset(0 0 50% 0); opacity: .55; }
.ring.front { clip-path: inset(50% 0 0 0); }
.bracket { width: 74px; height: 74px; border: 0 solid var(--accent); filter: drop-shadow(0 0 10px rgba(95,242,232,.6)); }
.tl { left: 168px; top: 150px; border-top-width: 12px; border-left-width: 12px; }
.tr { right: 168px; top: 150px; border-top-width: 12px; border-right-width: 12px; }
.bl { left: 168px; bottom: 210px; border-bottom-width: 12px; border-left-width: 12px; opacity: 0; }
.arm { left: 197px; top: 540px; width: 420px; transform: rotate(-26deg); transform-origin: 378px 31px; filter: drop-shadow(0 -6px 22px rgba(255,140,50,.4)) brightness(1.08); } /* кисть — у (575, 571), рукав уходит за нижний край */
.warm { left: 0; top: 0; width: 800px; height: 800px; background: radial-gradient(circle at 372px 330px, rgba(255,160,60,.35) 0, rgba(255,160,60,0) 420px); mix-blend-mode: soft-light; }
</style>
</head>
<body>
<div class="av">
  <canvas id="stars" width="800" height="800"></canvas>
  <div class="glow"></div>
  <div class="ring back"></div>
  <div class="planet"></div>
  <div class="ring front"></div>
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <img class="arm" src="src/arm.png">
  <div class="warm"></div>
</div>
<script>
const ctx = document.getElementById('stars').getContext('2d');
let seed = 5;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
for (let i = 0; i < 90; i++) {
  ctx.fillStyle = `rgba(220,232,255,${0.2 + rnd() * 0.5})`;
  ctx.beginPath();
  ctx.arc(rnd() * 800, rnd() * 800, rnd() < 0.85 ? 1.2 : 2.2, 0, Math.PI * 2);
  ctx.fill();
}
Promise.all([...document.images].map((im) => im.decode().catch(() => {}))).then(() => (window.ready = true));
</script>
</body>
</html>
