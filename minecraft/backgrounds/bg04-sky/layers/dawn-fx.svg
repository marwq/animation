<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
<title>bg04-sky — dawn: виньетка и свет</title>
<defs>
<linearGradient id="bg04-dawn-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3474"/><stop offset="0.45" stop-color="#8a6aa8"/><stop offset="0.8" stop-color="#f09aa6"/><stop offset="1" stop-color="#ffc49a"/></linearGradient>
<radialGradient id="bg04-dawn-vig" cx="0.5" cy="0.46" r="0.78">
  <stop offset="0.55" stop-color="#1a0a2a" stop-opacity="0"/>
  <stop offset="1" stop-color="#1a0a2a" stop-opacity="0.38"/>
</radialGradient>
<filter id="bg04-dawn-ink" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
  <feMorphology in="SourceAlpha" operator="dilate" radius="3.3" result="d"/>
  <feFlood flood-color="#24152a" result="c"/>
  <feComposite in="c" in2="d" operator="in" result="o"/>
  <feMerge result="m"><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
  <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5" result="t"/>
  <feDisplacementMap in="m" in2="t" scale="4" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="bg04-dawn-ink-soft" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
  <feMorphology in="SourceAlpha" operator="dilate" radius="1.6" result="d"/>
  <feFlood flood-color="#24152a" flood-opacity="0.55" result="c"/>
  <feComposite in="c" in2="d" operator="in" result="o"/>
  <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="bg04-dawn-blur-far" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="4.5"/></filter>
<filter id="bg04-dawn-blur-mid" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.8"/></filter>
<filter id="bg04-dawn-blur-dof" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="11"/></filter>
<filter id="bg04-dawn-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="28"/></filter>
<filter id="bg04-dawn-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="bg04-dawn-blur-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<g id="fx">
<rect x="0" y="0" width="1080" height="1920" fill="url(#bg04-dawn-vig)"/>
</g>
</svg>
