<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
<title>bg06-underwater — underwater: виньетка и свет</title>
<defs>
<linearGradient id="bg06-underwater-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fe0e8"/><stop offset="0.22" stop-color="#3aa0b0"/><stop offset="0.55" stop-color="#1d6a7a"/><stop offset="1" stop-color="#0b3240"/></linearGradient>
<radialGradient id="bg06-underwater-vig" cx="0.5" cy="0.46" r="0.78">
  <stop offset="0.55" stop-color="#021820" stop-opacity="0"/>
  <stop offset="1" stop-color="#021820" stop-opacity="0.7"/>
</radialGradient>
<filter id="bg06-underwater-ink" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
  <feMorphology in="SourceAlpha" operator="dilate" radius="3.3" result="d"/>
  <feFlood flood-color="#06222a" result="c"/>
  <feComposite in="c" in2="d" operator="in" result="o"/>
  <feMerge result="m"><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
  <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5" result="t"/>
  <feDisplacementMap in="m" in2="t" scale="4" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="bg06-underwater-ink-soft" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
  <feMorphology in="SourceAlpha" operator="dilate" radius="1.6" result="d"/>
  <feFlood flood-color="#06222a" flood-opacity="0.55" result="c"/>
  <feComposite in="c" in2="d" operator="in" result="o"/>
  <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="bg06-underwater-blur-far" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="4.5"/></filter>
<filter id="bg06-underwater-blur-mid" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.8"/></filter>
<filter id="bg06-underwater-blur-dof" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="11"/></filter>
<filter id="bg06-underwater-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="28"/></filter>
<filter id="bg06-underwater-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="bg06-underwater-blur-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<g id="fx">
<rect x="0" y="0" width="1080" height="1920" fill="url(#bg06-underwater-vig)"/>
</g>
</svg>
